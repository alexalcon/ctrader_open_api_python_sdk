name: ctrader_open_api_python_sdk
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - ipython=9.18.1
  - jupyterlab=4.6.5
  - numpy=2.5.4
  - matplotlib=3.11.2
  - pandas=3.1.0
  - python-dotenv=1.2.4
  - pipdeptree=3.1.1
  - requests=2.32.3  # pinned to match ctrader-open-api==0.9.2 (requires requests==2.32.3)
  - pip:
      - ctrader-open-api==0.9.2
      - service-identity==24.2.0  # Twisted TLS hostname check; 26.x needs cryptography>=43, which breaks pyOpenSSL 24.1.0
      - -e .  # installs the local `common` package
